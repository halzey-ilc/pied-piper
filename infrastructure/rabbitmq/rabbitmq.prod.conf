# Production RabbitMQ configuration (used by compose.prod.yaml).
# Extends the development config with a TLS listener and no plaintext AMQP.

disk_free_limit.absolute = 200MB
deprecated_features.permit.transient_nonexcl_queues = true

log.console = true
log.console.level = info
# Never log message bodies or credentials.

# Disable the plaintext AMQP listener; serve AMQPS only.
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq-tls/ca.crt
ssl_options.certfile   = /etc/rabbitmq-tls/server.crt
ssl_options.keyfile    = /etc/rabbitmq-tls/server.key
# Require clients to present no cert (verify_none) but encrypt the channel.
# Set to verify_peer + fail_if_no_peer_cert for mutual TLS once clients have certs.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

# The default guest user is already restricted to localhost; the app uses its
# own vhost/user. Do not create guest access over the network.
loopback_users.guest = true
