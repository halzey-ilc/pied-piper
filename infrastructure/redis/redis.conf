# Local development Redis configuration.
# Used as Django cache and Celery result backend. No persistence of business
# data: critical business events live in PostgreSQL + the outbox, never only
# in Redis (see docs/architecture/async-processing.md).

maxmemory 256mb
maxmemory-policy allkeys-lru
appendonly no
save ""
# In production, set `requirepass` (via REDIS_PASSWORD) and enable TLS.
