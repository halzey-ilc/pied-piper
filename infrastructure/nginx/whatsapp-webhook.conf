# The public side of the tunnel: the Green API webhook and nothing else.
server {
    listen 8080;
    client_max_body_size 1m;

    location /api/v1/webhooks/green_api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
