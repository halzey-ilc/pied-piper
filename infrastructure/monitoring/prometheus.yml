# Example Prometheus scrape configuration (not wired into compose.yaml by
# default — observability backends are opt-in). The API exposes /metrics
# (token-guarded via METRICS_TOKEN); the Celery worker exposes :9100.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: crm-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token   # contents = METRICS_TOKEN
    static_configs:
      - targets: ["api:8000"]

  - job_name: crm-worker
    static_configs:
      - targets: ["worker:9100"]
