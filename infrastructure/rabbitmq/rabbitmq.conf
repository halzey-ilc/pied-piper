# Local development RabbitMQ configuration.
# The default user/vhost come from RABBITMQ_DEFAULT_* in compose.yaml.

# Refuse to boot if disk is nearly full (protects against silent message loss).
disk_free_limit.absolute = 200MB

# RabbitMQ 4 blocks transient non-exclusive queues by default, but Celery's
# remote-control / mingle (pidbox) relies on them. Re-permit the feature so the
# worker's control plane works. (Business queues are durable regardless.)
deprecated_features.permit.transient_nonexcl_queues = true

# Publisher confirms are requested by the app (confirm_publish); keep the
# broker durable so confirmed messages survive a restart.
# (queues and the dead-letter exchange are declared by the application)

# Do not log message bodies.
log.console = true
log.console.level = info

# In production: enable TLS listeners, disable the management plugin's guest
# access, and run behind the internal network only.
