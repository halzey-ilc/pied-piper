# TLS-terminating reverse proxy in front of the API (compose.prod.yaml).
# This is edge TLS only; a real deployment usually sits behind a WAF / managed
# load balancer as well (see docs/operations/production-hardening.md).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Modern TLS only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Edge rate limiting (coarse; the app enforces per-user throttles too).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    upstream api {
        server api:8000;
    }

    # Redirect plaintext to HTTPS.
    server {
        listen 80;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;

        # HSTS (the app also sets this; harmless to repeat at the edge).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        client_max_body_size 10m;

        location / {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # Never expose the metrics endpoint at the edge; scrape it inside the
        # network with the metrics token instead.
        location /metrics {
            return 404;
        }
    }
}
